name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  headless-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --editor --quit

      - name: Run headless test suites
        run: |
          set -e
          suites=(
            test_utility test_event_bus test_theme_manager test_asset_id_scanner
            test_node_pool test_impact_vfx test_world_environment test_camera_director
            test_hud_polish test_sfx_player test_music_director test_audio_mixing
          )
          failed=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            if godot --headless --script "res://tests/$suite.gd"; then
              echo "PASS $suite"
            else
              echo "FAIL $suite"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Regenerate asset worklist and fail on drift
        run: |
          godot --headless --script res://scripts/run_asset_scan.gd
          git diff --exit-code exports/asset_worklist.md
